; Runs as root and drops to `frappe` per program. Started by entrypoint.sh. MariaDB runs in its own
; container (deploy/docker-compose.yml), so only Redis and the Frappe processes live here.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:redis]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
command=/usr/bin/redis-server /home/frappe/redis.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

; One-shot: create site, install apps, migrate. Not restarted once it has exited 0.
[program:site-setup]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/site-setup.sh
autostart=true
autorestart=false
startretries=0
priority=20
stdout_logfile=/var/log/supervisor/site-setup.log
stderr_logfile=/var/log/supervisor/site-setup.err.log

[program:backend]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh /usr/local/bin/run-backend.sh
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:websocket]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh node apps/frappe/socketio.js
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/websocket.log
stderr_logfile=/var/log/supervisor/websocket.err.log

[program:worker]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh bench worker --queue default,short,long
autostart=true
autorestart=true
priority=30
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err.log

; A dedicated `long` worker: AI summaries / Ask Data jobs run there and must not wait behind a backlog.
[program:worker-long]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh bench worker --queue long
autostart=true
autorestart=true
priority=30
stopwaitsecs=120
stdout_logfile=/var/log/supervisor/worker-long.log
stderr_logfile=/var/log/supervisor/worker-long.err.log

[program:scheduler]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh bench schedule
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err.log

; Daily `bench backup --with-files`, copied to S3 when BACKUP_S3_BUCKET is set.
[program:backup]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh /usr/local/bin/backup.sh
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/backup.log
stderr_logfile=/var/log/supervisor/backup.err.log
